packages:
  - ./*
  - ./traforo/website
  # subrouter is its own pnpm workspace. Take only its published packages, not
  # the private root, so `pnpm -r` here does not recurse into its own -r build.
  - '!./subrouter'
  - ./subrouter/cli
  - ./subrouter/opencode
  # OpenCode v2 submodule is bun-only. Tests import its tester files, not as a workspace package.
  - '!./opencode-v2'
  - '!./opencode-v2/**'
